name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a deploy that is already running

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bitcode/shared build
      - run: pnpm --filter @bitcode/api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy to server
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts   # pinned host key: no trust-on-first-use
      - name: Upload code
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude dist --exclude .git --exclude .github \
            --exclude '.env*' --exclude ops --exclude '*.log' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/bitcode-tracker/"
      - name: Release (install, migrate, build, restart)
        run: ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'cd /var/www/bitcode-tracker && bash deploy/release.sh'
      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://tracker.bitcodes.co.in/api/health && exit 0
            sleep 5
          done
          echo "Health check failed" && exit 1
